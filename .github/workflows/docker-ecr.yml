name: Build and Push Docker Image to ECR and Deploy

on:
  push:
    branches: ["dev", "stage", "main", "prod"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Optional override for manual run"
        type: choice
        required: false
        default: dev
        options:
          - dev
          - stage
          - prod
      mobsfscan_tag:
        description: "Optional MobSFScan tag for manual run"
        type: string
        required: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'mudita-appstore-mobfscan' }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::216989105762:role/GitHub-ECR' }}
  AWS_ROLE_TO_ASSUME_PROD: ${{ vars.AWS_ROLE_TO_ASSUME_PROD || 'arn:aws:iam::043671579572:role/GitHub-ECR' }}
  ECR_REGISTRY_PROD: ${{ vars.ECR_REGISTRY_PROD || '043671579572.dkr.ecr.eu-central-1.amazonaws.com' }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push Docker image to ECR
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.target.outputs.name }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "name=dev" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "stage" ]; then
            echo "name=stage" >> "$GITHUB_OUTPUT"
          else
            echo "name=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.target.outputs.name == 'prod' && env.AWS_ROLE_TO_ASSUME_PROD || env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # ECR has tag immutability enabled — push only the unique commit SHA tag.
          # ECS deployment references this tag directly; do NOT push floating tags
          # (prod/stage/dev/latest): they can't be overwritten on an immutable repo,
          # which was failing every re-deploy ("tag 'prod' already exists ... immutable").
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Image tag $IMAGE_TAG already exists in ECR, skipping push"
          else
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          fi

  deploy-dev:
    name: Deploy to ECS Dev
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.target_env == 'dev'

    permissions:
      id-token: write
      contents: read

    env:
      ECS_CLUSTER: mudita-appstore-dev
      ECS_SERVICE: appstore-dev-scan-service
      ECS_TASK_DEFINITION: .aws/ecs-task-def-dev.json
      CONTAINER_NAME: appstore-dev-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Inject image into task definition
        id: task-def-image
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          environment-variables: |
            MOBSFSCAN_TAG=${{ github.ref_type == 'tag' && github.ref_name || inputs.mobsfscan_tag || 'no-tag' }}
            MOBSFSCAN_COMMIT=${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-image.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-stage:
    name: Deploy to ECS Stage
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.target_env == 'stage'

    permissions:
      id-token: write
      contents: read

    # stage lives in the nonprod account (216989105762), same as dev → nonprod
    # GitHub-ECR role.
    env:
      ECS_CLUSTER: mudita-appstore-stage
      ECS_SERVICE: appstore-stage-scan-service
      ECS_TASK_DEFINITION: .aws/ecs-task-def-stage.json
      CONTAINER_NAME: appstore-stage-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Inject image into task definition
        id: task-def-image
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          environment-variables: |
            MOBSFSCAN_TAG=${{ github.ref_type == 'tag' && github.ref_name || inputs.mobsfscan_tag || 'no-tag' }}
            MOBSFSCAN_COMMIT=${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-image.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-prod:
    name: Deploy to ECS Prod
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.target_env == 'prod'

    permissions:
      id-token: write
      contents: read

    env:
      ECS_CLUSTER: mudita-appstore-prod
      ECS_SERVICE: appstore-prod-scan-service
      ECS_TASK_DEFINITION: .aws/ecs-task-def-prod.json
      CONTAINER_NAME: appstore-prod-scan
      AWS_ROLE_TO_ASSUME: arn:aws:iam::043671579572:role/GitHub-ECS-Deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inject image into task definition
        id: task-def-image
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY_PROD }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          environment-variables: |
            MOBSFSCAN_TAG=${{ github.ref_type == 'tag' && github.ref_name || inputs.mobsfscan_tag || 'no-tag' }}
            MOBSFSCAN_COMMIT=${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-image.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
