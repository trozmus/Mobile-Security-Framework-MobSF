services:

  mobsf:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - mobsf_data:/home/mobsf/.MobSF
    env_file:
      - .env
    environment:
      # AWS Configuration
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - NODE_ENV=${NODE_ENV:-local}
      
      # MemoryDB/Valkey Configuration
      - VALKEY_HOST=${VALKEY_HOST:-host.docker.internal}
      - VALKEY_PORT=${VALKEY_PORT:-6379}
      - VALKEY_USERNAME=${VALKEY_USERNAME:-default}
      - MEMORYDB_CLUSTER_NAME=${MEMORYDB_CLUSTER_NAME}
      
      # PostgreSQL Configuration
      - POSTGRES_HOST=${POSTGRES_HOST:-host.docker.internal}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-mobsf}
      
      # For IAM auth: don't set POSTGRES_PASSWORD, let aws_auth.py generate token
      # For local dev: set POSTGRES_PASSWORD if not using IAM
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      
      # BullMQ queue names — must match QueueNames in NestJS (with {} for cluster slot)
      - QUEUE_INPUT=${QUEUE_INPUT:-{app-scanner-requests}}
      - QUEUE_OUTPUT=${QUEUE_OUTPUT:-{app-scanner-results}}
      - QUEUE_ERRORS=${QUEUE_ERRORS:-{app-scanner-errors}}

      # Other
      - MOBSF_API_KEY=${MOBSF_API_KEY}
      - HOSTNAME=${HOSTNAME:-0.0.0.0}
      - AWS_BUCKET_NAME_PRIVATE=${AWS_BUCKET_NAME_PRIVATE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/login/"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mobsf_data:
